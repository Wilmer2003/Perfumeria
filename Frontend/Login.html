<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Perfumería - Iniciar Sesión</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 
    :root {
      --cream:    #f5f0e8;
      --gold:     #b8935a;
      --gold-lt:  #d4af78;
      --dark:     #1a1208;
      --mid:      #3d2b10;
      --error:    #c0392b;
      --radius:   4px;
      --trans:    0.35s cubic-bezier(.4,0,.2,1);
    }
 
    body {
      min-height: 100vh;
      display: flex;
      font-family: 'Jost', sans-serif;
      background: var(--dark);
      overflow: hidden;
    }
 
    /* ── decorative left panel ── */
    .panel-left {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 3rem;
      overflow: hidden;
    }
    .panel-left::before {
      content: '';
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 30% 50%, rgba(184,147,90,.18) 0%, transparent 70%),
        radial-gradient(ellipse 50% 80% at 70% 20%, rgba(184,147,90,.08) 0%, transparent 60%);
    }
    .panel-left::after {
      content: '';
      position: absolute; right: 0; top: 0; bottom: 0; width: 1px;
      background: linear-gradient(to bottom, transparent, var(--gold), transparent);
      opacity: .4;
    }
 
    /* floating orbs */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: .12;
      animation: drift 8s ease-in-out infinite alternate;
    }
    .orb-1 { width: 320px; height: 320px; background: var(--gold); top: -60px; left: -80px; animation-delay: 0s; }
    .orb-2 { width: 200px; height: 200px; background: #d4af78; bottom: 60px; right: 40px; animation-delay: -3s; }
    .orb-3 { width: 150px; height: 150px; background: #fff8ec; top: 50%; left: 50%; animation-delay: -5s; }
    @keyframes drift {
      from { transform: translate(0,0) scale(1); }
      to   { transform: translate(20px, 20px) scale(1.08); }
    }
 
    .brand {
      position: relative;
      text-align: center;
    }
    .brand-icon {
      font-size: 3.5rem;
      line-height: 1;
      margin-bottom: .6rem;
      display: block;
      animation: fadeUp .9s ease both;
    }
    .brand-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2rem, 4vw, 3.2rem);
      font-weight: 300;
      letter-spacing: .18em;
      color: var(--cream);
      animation: fadeUp .9s ease .1s both;
    }
    .brand-name span { color: var(--gold-lt); font-style: italic; }
    .brand-tagline {
      margin-top: .8rem;
      font-size: .75rem;
      letter-spacing: .3em;
      text-transform: uppercase;
      color: rgba(245,240,232,.4);
      animation: fadeUp .9s ease .2s both;
    }
 
    .deco-line {
      width: 60px; height: 1px;
      background: linear-gradient(to right, transparent, var(--gold), transparent);
      margin: 2rem auto;
      animation: fadeUp .9s ease .3s both;
    }
 
    .brand-quote {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.05rem;
      color: rgba(245,240,232,.5);
      max-width: 260px;
      text-align: center;
      line-height: 1.7;
      animation: fadeUp .9s ease .4s both;
    }
 
    /* ── right form panel ── */
    .panel-right {
      width: 420px;
      min-height: 100vh;
      background: var(--cream);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 2.5rem;
      position: relative;
    }
    .panel-right::before {
      content: '';
      position: absolute; inset: 0;
      background: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='20' cy='20' r='.6' fill='%23b8935a' fill-opacity='.12'/%3E%3C/svg%3E");
      pointer-events: none;
    }
 
    .form-card {
      position: relative;
      width: 100%;
      animation: fadeUp .8s ease .2s both;
    }
 
    .form-header { margin-bottom: 2.4rem; }
    .form-header h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2rem;
      font-weight: 400;
      color: var(--dark);
      letter-spacing: .04em;
    }
    .form-header h2 em {
      font-style: italic;
      color: var(--gold);
    }
    .form-header p {
      margin-top: .4rem;
      font-size: .8rem;
      letter-spacing: .08em;
      color: rgba(26,18,8,.45);
      text-transform: uppercase;
    }
 
    /* role selector */
    .role-tabs {
      display: flex;
      gap: .5rem;
      margin-bottom: 1.8rem;
      background: rgba(184,147,90,.1);
      border-radius: var(--radius);
      padding: 4px;
    }
    .role-tab {
      flex: 1;
      padding: .55rem .5rem;
      border: none;
      background: transparent;
      border-radius: calc(var(--radius) - 2px);
      font-family: 'Jost', sans-serif;
      font-size: .78rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: rgba(26,18,8,.5);
      cursor: pointer;
      transition: var(--trans);
    }
    .role-tab.active {
      background: var(--gold);
      color: #fff;
      box-shadow: 0 2px 12px rgba(184,147,90,.35);
    }
 
    /* field */
    .field { margin-bottom: 1.2rem; position: relative; }
    .field label {
      display: block;
      font-size: .72rem;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: rgba(26,18,8,.5);
      margin-bottom: .45rem;
    }
    .field input {
      width: 100%;
      padding: .75rem 1rem;
      border: 1px solid rgba(184,147,90,.3);
      border-radius: var(--radius);
      background: #fff;
      font-family: 'Jost', sans-serif;
      font-size: .92rem;
      color: var(--dark);
      outline: none;
      transition: var(--trans);
    }
    .field input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(184,147,90,.15);
    }
    .field input.error-input {
      border-color: var(--error);
      box-shadow: 0 0 0 3px rgba(192,57,43,.1);
    }
    .field-error {
      font-size: .72rem;
      color: var(--error);
      margin-top: .3rem;
      display: none;
    }
    .field-error.show { display: block; }
 
    /* password toggle */
    .pass-wrapper { position: relative; }
    .pass-wrapper input { padding-right: 2.8rem; }
    .pass-toggle {
      position: absolute; right: .85rem; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: rgba(26,18,8,.35); font-size: 1rem;
      transition: color var(--trans);
    }
    .pass-toggle:hover { color: var(--gold); }
 
    /* remember / forgot */
    .form-extras {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.6rem;
    }
    .check-label {
      display: flex; align-items: center; gap: .45rem;
      font-size: .78rem; color: rgba(26,18,8,.55); cursor: pointer;
    }
    .check-label input[type=checkbox] { accent-color: var(--gold); width: 14px; height: 14px; }
    .forgot-link {
      font-size: .78rem; color: var(--gold);
      text-decoration: none; letter-spacing: .04em;
      transition: opacity var(--trans);
    }
    .forgot-link:hover { opacity: .7; }
 
    /* submit btn */
    .btn-submit {
      width: 100%;
      padding: .85rem 1rem;
      background: var(--gold);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-family: 'Jost', sans-serif;
      font-size: .85rem;
      letter-spacing: .18em;
      text-transform: uppercase;
      cursor: pointer;
      transition: var(--trans);
      position: relative;
      overflow: hidden;
    }
    .btn-submit::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,.15) 50%, transparent 70%);
      transform: translateX(-100%);
      transition: transform .5s ease;
    }
    .btn-submit:hover { background: var(--mid); box-shadow: 0 6px 24px rgba(26,18,8,.25); }
    .btn-submit:hover::after { transform: translateX(100%); }
    .btn-submit:disabled { opacity: .6; cursor: not-allowed; }
 
    /* loader inside btn */
    .btn-loader { display: none; }
    .btn-submit.loading .btn-text { display: none; }
    .btn-submit.loading .btn-loader { display: inline-block; width: 18px; height: 18px; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: spin .6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
 
    /* global alert */
    .alert {
      padding: .75rem 1rem;
      border-radius: var(--radius);
      font-size: .82rem;
      margin-bottom: 1.2rem;
      display: none;
    }
    .alert.show { display: block; }
    .alert-error { background: rgba(192,57,43,.08); color: var(--error); border-left: 3px solid var(--error); }
    .alert-success { background: rgba(39,174,96,.08); color: #27ae60; border-left: 3px solid #27ae60; }
 
    /* footer */
    .form-footer {
      margin-top: 1.8rem;
      text-align: center;
      font-size: .72rem;
      letter-spacing: .06em;
      color: rgba(26,18,8,.35);
    }
    .form-footer span { color: var(--gold); }
 
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
 
    /* ── responsive ── */
    @media (max-width: 700px) {
      .panel-left { display: none; }
      .panel-right { width: 100%; }
    }
  </style>
</head>
<body>
 
  <!-- LEFT DECORATIVE PANEL -->
  <div class="panel-left">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="brand">
      <span class="brand-icon">🌸</span>
      <div class="brand-name">Essence <span>& Co.</span></div>
      <div class="brand-tagline">Tienda de Perfumería</div>
      <div class="deco-line"></div>
      <p class="brand-quote">"El perfume es la forma más intensa del recuerdo."</p>
    </div>
  </div>
 
  <!-- RIGHT FORM PANEL -->
  <div class="panel-right">
    <div class="form-card">
 
      <div class="form-header">
        <h2>Bienvenido <em>de vuelta</em></h2>
        <p>Ingresa tus credenciales para continuar</p>
      </div>
 
      <!-- role tabs -->
      <div class="role-tabs">
        <button class="role-tab active" data-role="cliente">Cliente</button>
        <button class="role-tab" data-role="vendedor">Vendedor</button>
        <button class="role-tab" data-role="gerente">Gerente</button>
      </div>
 
      <!-- alert global -->
      <div class="alert alert-error" id="alertError"></div>
      <div class="alert alert-success" id="alertSuccess"></div>
 
      <!-- form -->
      <form id="loginForm" novalidate>
        <input type="hidden" id="roleInput" name="role" value="cliente"/>
 
        <div class="field">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" placeholder="correo@ejemplo.com" autocomplete="email"/>
          <div class="field-error" id="emailError">Ingresa un correo válido.</div>
        </div>
 
        <div class="field">
          <label for="password">Contraseña</label>
          <div class="pass-wrapper">
            <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password"/>
            <button type="button" class="pass-toggle" id="passToggle" title="Mostrar contraseña">👁️</button>
          </div>
          <div class="field-error" id="passwordError">La contraseña no puede estar vacía.</div>
        </div>
 
        <div class="form-extras">
          <label class="check-label">
            <input type="checkbox" id="remember"/> Recordarme
          </label>
          <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
        </div>
 
        <button type="submit" class="btn-submit" id="btnSubmit">
          <span class="btn-text">Ingresar</span>
          <span class="btn-loader"></span>
        </button>
      </form>
 
      <div class="form-footer">
        Sistema de Gestión · <span>Perfumería</span> · UPAO 2026
      </div>
 
    </div>
  </div>
 
  <script>
    // ── Role tabs ──────────────────────────────────────────────
    const tabs = document.querySelectorAll('.role-tab');
    const roleInput = document.getElementById('roleInput');
 
    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        roleInput.value = tab.dataset.role;
        clearAlerts();
      });
    });
 
    // ── Password toggle ────────────────────────────────────────
    const passInput   = document.getElementById('password');
    const passToggle  = document.getElementById('passToggle');
    passToggle.addEventListener('click', () => {
      const show = passInput.type === 'password';
      passInput.type = show ? 'text' : 'password';
      passToggle.textContent = show ? '🙈' : '👁️';
    });
 
    // ── Helpers ────────────────────────────────────────────────
    function showError(id, msg) {
      const el = document.getElementById(id);
      el.textContent = msg;
      el.classList.add('show');
    }
    function clearFieldError(id) {
      document.getElementById(id).classList.remove('show');
    }
    function clearAlerts() {
      document.getElementById('alertError').classList.remove('show');
      document.getElementById('alertSuccess').classList.remove('show');
    }
    function showGlobalError(msg) {
      const el = document.getElementById('alertError');
      el.textContent = msg;
      el.classList.add('show');
    }
 
    // ── Validation ─────────────────────────────────────────────
    function validate() {
      let ok = true;
      const emailVal = document.getElementById('email').value.trim();
      const passVal  = document.getElementById('password').value;
 
      clearFieldError('emailError');
      clearFieldError('passwordError');
      document.getElementById('email').classList.remove('error-input');
      document.getElementById('password').classList.remove('error-input');
 
      const emailRgx = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRgx.test(emailVal)) {
        showError('emailError', 'Ingresa un correo electrónico válido.');
        document.getElementById('email').classList.add('error-input');
        ok = false;
      }
      if (!passVal) {
        showError('passwordError', 'La contraseña no puede estar vacía.');
        document.getElementById('password').classList.add('error-input');
        ok = false;
      }
      return ok;
    }
 
    // ── Submit ─────────────────────────────────────────────────
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      clearAlerts();
      if (!validate()) return;
 
      const btn = document.getElementById('btnSubmit');
      btn.classList.add('loading');
      btn.disabled = true;
 
      const payload = {
        correo:     document.getElementById('email').value.trim(),
        contrasena: document.getElementById('password').value,
        rol:        roleInput.value
      };
 
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
 
        const data = await res.json();
 
        if (res.ok) {
          // Guardar token si la API lo retorna
          if (data.access_token) {
            localStorage.setItem('token', data.access_token);
            localStorage.setItem('rol', payload.rol);
          }
          // Redirigir según rol (RNF 02)
          const rutas = {
            gerente:  'Gerente.html',
            vendedor: 'Vendedor.html',
            cliente:  'Catalogo.html'
          };
          window.location.href = rutas[payload.rol] || 'Catalogo.html';
        } else {
          showGlobalError(data.detail || 'Credenciales incorrectas. Intenta nuevamente.');
        }
      } catch (err) {
        showGlobalError('No se pudo conectar con el servidor. Verifica tu conexión.');
      } finally {
        btn.classList.remove('loading');
        btn.disabled = false;
      }
    });
 
    // Limpiar error al escribir
    document.getElementById('email').addEventListener('input', () => {
      clearFieldError('emailError');
      document.getElementById('email').classList.remove('error-input');
    });
    document.getElementById('password').addEventListener('input', () => {
      clearFieldError('passwordError');
      document.getElementById('password').classList.remove('error-input');
    });
  </script>
</body>
</html>
