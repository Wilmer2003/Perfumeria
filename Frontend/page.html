<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Essence & Co. | Perfumería</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --gold: #c9a84c; --gold2: #e8c97a;
      --dark: #1a1612; --dark2: #241f19; --dark3: #2e2820;
      --cream: #f5f0e8; --muted: #9a9080;
      --success: #1e8449; --error: #c0392b;
    }
    body { font-family: 'Jost', sans-serif; background: #f0ebe0; color: var(--dark); min-height: 100vh; }

    /* NAVBAR */
    .navbar {
      background: var(--dark2); padding: 0 32px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100; height: 64px;
      box-shadow: 0 2px 20px rgba(0,0,0,0.4);
    }
    .logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.5rem; color: var(--gold); letter-spacing: 0.1em;
      display: flex; align-items: center; gap: 10px;
    }
    .nav-links { display: flex; align-items: center; gap: 10px; }
    .btn-nav {
      padding: 8px 18px; border-radius: 8px; font-family: 'Jost', sans-serif;
      font-size: 0.85rem; font-weight: 500; cursor: pointer; transition: all 0.2s;
      letter-spacing: 0.05em;
    }
    .btn-ingresar {
      background: transparent; color: var(--muted);
      border: 1px solid rgba(201,168,76,0.3);
    }
    .btn-ingresar:hover { border-color: var(--gold); color: var(--gold); }
    .btn-carrito {
      background: var(--gold); color: var(--dark); border: none;
      display: flex; align-items: center; gap: 8px;
    }
    .btn-carrito:hover { background: var(--gold2); }
    .carrito-count {
      background: var(--error); color: white; border-radius: 50%;
      width: 20px; height: 20px; display: flex; align-items: center;
      justify-content: center; font-size: 0.72rem; font-weight: 600;
    }
    .btn-staff {
      background: transparent; color: var(--muted);
      border: 1px solid rgba(255,255,255,0.1); font-size: 0.78rem;
    }
    .btn-staff:hover { color: var(--cream); border-color: rgba(255,255,255,0.3); }

    /* HERO */
    .hero {
      background: linear-gradient(135deg, var(--dark) 0%, var(--dark3) 100%);
      padding: 80px 32px; text-align: center; position: relative; overflow: hidden;
    }
    .hero::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse at center, rgba(201,168,76,0.08) 0%, transparent 70%);
    }
    .hero-content { position: relative; z-index: 1; }
    .hero-icon { font-size: 3rem; margin-bottom: 16px; display: block; }
    .hero h1 {
      font-family: 'Cormorant Garamond', serif; font-size: 3rem;
      color: var(--cream); margin-bottom: 12px; letter-spacing: 0.05em;
    }
    .hero h1 em { color: var(--gold); font-style: italic; }
    .hero p { color: var(--muted); font-size: 1rem; margin-bottom: 32px; font-weight: 300; }
    .hero-search {
      display: flex; gap: 10px; max-width: 560px; margin: 0 auto;
    }
    .hero-search input {
      flex: 1; padding: 13px 18px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(201,168,76,0.2);
      border-radius: 10px; color: var(--cream);
      font-family: 'Jost', sans-serif; font-size: 0.95rem; outline: none;
      transition: border-color 0.2s;
    }
    .hero-search input::placeholder { color: var(--muted); }
    .hero-search input:focus { border-color: var(--gold); }
    .hero-search select {
      padding: 13px 14px; background: rgba(255,255,255,0.07);
      border: 1px solid rgba(201,168,76,0.2); border-radius: 10px;
      color: var(--cream); font-family: 'Jost', sans-serif;
      font-size: 0.85rem; outline: none; cursor: pointer;
    }
    .hero-search select option { background: var(--dark2); }

    /* CONTAINER */
    .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
    .section-label {
      font-family: 'Cormorant Garamond', serif; font-size: 1.4rem;
      color: var(--dark2); margin-bottom: 24px;
      display: flex; align-items: center; gap: 12px;
    }
    .section-label::after { content: ''; flex: 1; height: 1px; background: rgba(0,0,0,0.1); }

    /* GRID */
    .grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 22px;
    }
    .prod-card {
      background: white; border-radius: 14px; overflow: hidden;
      box-shadow: 0 2px 14px rgba(0,0,0,0.07);
      transition: transform 0.25s, box-shadow 0.25s;
      display: flex; flex-direction: column;
    }
    .prod-card:hover { transform: translateY(-5px); box-shadow: 0 10px 28px rgba(0,0,0,0.12); }
    .prod-img {
      background: linear-gradient(135deg, var(--dark2), var(--dark3));
      height: 170px; display: flex; align-items: center;
      justify-content: center; font-size: 4rem; position: relative;
    }
    .prod-badge-stock {
      position: absolute; top: 10px; right: 10px;
      background: rgba(192,57,43,0.9); color: white;
      font-size: 0.7rem; padding: 3px 8px; border-radius: 20px;
    }
    .prod-body { padding: 18px; flex: 1; display: flex; flex-direction: column; }
    .prod-cat {
      font-size: 0.7rem; color: var(--gold);
      letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 6px;
    }
    .prod-nombre {
      font-family: 'Cormorant Garamond', serif; font-size: 1.2rem;
      font-weight: 600; color: var(--dark2); margin-bottom: 4px;
    }
    .prod-codigo { font-size: 0.75rem; color: var(--muted); margin-bottom: 8px; }
    .prod-desc { font-size: 0.82rem; color: #666; line-height: 1.5; flex: 1; margin-bottom: 14px; }
    .prod-footer {
      display: flex; align-items: flex-end; justify-content: space-between;
      padding-top: 12px; border-top: 1px solid #f0ece4;
    }
    .prod-precio {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.5rem; font-weight: 600; color: var(--dark2); line-height: 1;
    }
    .prod-precio small { font-size: 0.75rem; color: var(--muted); font-family: 'Jost', sans-serif; }
    .prod-presentacion {
      font-size: 0.72rem; background: #f5f0e8;
      color: var(--muted); padding: 4px 10px; border-radius: 20px;
    }
    .btn-agregar {
      width: 100%; margin-top: 12px; padding: 11px;
      background: var(--dark2); color: var(--cream); border: none;
      border-radius: 9px; font-family: 'Jost', sans-serif;
      font-size: 0.85rem; font-weight: 500; cursor: pointer;
      transition: background 0.2s; letter-spacing: 0.05em;
    }
    .btn-agregar:hover { background: var(--gold); color: var(--dark); }
    .btn-agregar:disabled { background: #e0ddd8; color: #aaa; cursor: not-allowed; }

    /* EMPTY */
    .empty { text-align: center; padding: 60px 20px; color: var(--muted); grid-column: 1/-1; }
    .empty .icon { font-size: 3rem; margin-bottom: 12px; }

    /* MODAL LOGIN */
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      z-index: 200; display: none; align-items: center; justify-content: center;
    }
    .overlay.show { display: flex; }
    .modal-login {
      background: var(--dark2); border-radius: 16px; padding: 40px 36px;
      width: 100%; max-width: 400px; border: 1px solid rgba(201,168,76,0.2);
      box-shadow: 0 24px 60px rgba(0,0,0,0.5); animation: fadeUp 0.3s ease;
    }
    @keyframes fadeUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
    .modal-login h3 {
      font-family: 'Cormorant Garamond', serif; font-size: 1.6rem;
      color: var(--cream); margin-bottom: 6px;
    }
    .modal-login p { color: var(--muted); font-size: 0.85rem; margin-bottom: 24px; }
    .field { margin-bottom: 16px; }
    .field label {
      display: block; font-size: 0.75rem; font-weight: 500;
      color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 6px;
    }
    .field input {
      width: 100%; padding: 11px 14px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(201,168,76,0.15); border-radius: 8px;
      color: var(--cream); font-family: 'Jost', sans-serif; font-size: 0.9rem; outline: none;
      transition: border-color 0.2s;
    }
    .field input::placeholder { color: rgba(154,144,128,0.5); }
    .field input:focus { border-color: var(--gold); }
    .btn-modal-login {
      width: 100%; padding: 12px; background: var(--gold); color: var(--dark);
      border: none; border-radius: 9px; font-family: 'Jost', sans-serif;
      font-size: 0.9rem; font-weight: 500; cursor: pointer;
      transition: background 0.2s; margin-top: 4px; letter-spacing: 0.05em;
    }
    .btn-modal-login:hover { background: var(--gold2); }
    .btn-modal-login:disabled { opacity: 0.5; cursor: not-allowed; }
    .modal-msg { font-size: 0.82rem; color: #e57373; margin-bottom: 12px; min-height: 18px; }
    .modal-footer {
      text-align: center; margin-top: 16px;
      font-size: 0.82rem; color: var(--muted);
    }
    .modal-footer a { color: var(--gold); text-decoration: none; cursor: pointer; }
    .btn-cerrar-modal {
      position: absolute; top: 14px; right: 16px;
      background: none; border: none; color: var(--muted);
      font-size: 1.3rem; cursor: pointer;
    }

    /* CARRITO PANEL */
    .carrito-panel {
      position: fixed; top: 0; right: -440px; width: 420px; height: 100vh;
      background: white; z-index: 300; padding: 28px;
      overflow-y: auto; transition: right 0.3s ease;
      box-shadow: -4px 0 24px rgba(0,0,0,0.15);
    }
    .carrito-panel.open { right: 0; }
    .carrito-header {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;
    }
    .carrito-header h3 {
      font-family: 'Cormorant Garamond', serif; font-size: 1.4rem; color: var(--dark2);
    }
    .btn-cerrar-carrito { background: none; border: none; font-size: 1.4rem; cursor: pointer; color: var(--muted); }
    .carrito-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 0; border-bottom: 1px solid #f0ece4;
    }
    .carrito-item-info { flex: 1; }
    .carrito-item-info strong { display: block; font-size: 0.88rem; color: var(--dark2); }
    .carrito-item-info small { color: var(--muted); font-size: 0.76rem; }
    .qty-ctrl { display: flex; align-items: center; gap: 8px; }
    .btn-qty {
      width: 28px; height: 28px; border-radius: 50%; border: 1px solid #e0ddd8;
      background: white; cursor: pointer; font-size: 1rem;
      display: flex; align-items: center; justify-content: center; transition: all 0.2s;
    }
    .btn-qty:hover { border-color: var(--gold); color: var(--gold); }
    .qty-num { font-weight: 600; min-width: 20px; text-align: center; font-size: 0.9rem; }
    .item-precio { font-weight: 600; font-size: 0.88rem; color: var(--dark2); white-space: nowrap; }
    .btn-quitar { background: none; border: none; color: #ddd; cursor: pointer; font-size: 1rem; }
    .btn-quitar:hover { color: var(--error); }
    .carrito-total {
      margin-top: 20px; padding-top: 16px; border-top: 2px solid var(--dark2);
      display: flex; justify-content: space-between; align-items: center;
    }
    .carrito-total span { color: var(--muted); font-size: 0.85rem; }
    .carrito-total strong {
      font-family: 'Cormorant Garamond', serif; font-size: 1.6rem; color: var(--dark2);
    }
    .btn-confirmar {
      width: 100%; margin-top: 16px; padding: 14px;
      background: var(--dark2); color: var(--cream); border: none;
      border-radius: 10px; font-family: 'Jost', sans-serif;
      font-size: 0.9rem; font-weight: 500; cursor: pointer;
      transition: background 0.2s; letter-spacing: 0.08em;
    }
    .btn-confirmar:hover { background: var(--gold); color: var(--dark); }
    .carrito-vacio { text-align: center; padding: 40px 0; color: var(--muted); }
    .carrito-vacio .icon { font-size: 2.5rem; margin-bottom: 10px; }

    /* TOAST */
    .toast {
      position: fixed; bottom: 24px; right: 24px;
      background: var(--dark2); color: var(--cream);
      padding: 12px 20px; border-radius: 10px; font-size: 0.88rem;
      z-index: 999; border-left: 3px solid var(--gold);
      transform: translateY(80px); opacity: 0; transition: all 0.3s; pointer-events: none;
    }
    .toast.show { transform: translateY(0); opacity: 1; }

    /* USUARIO LOGUEADO */
    .user-info {
      display: flex; align-items: center; gap: 10px;
    }
    .user-avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--gold); color: var(--dark);
      display: flex; align-items: center; justify-content: center;
      font-weight: 600; font-size: 0.85rem;
    }
    .user-nombre { color: var(--cream); font-size: 0.85rem; }
    .btn-logout {
      background: transparent; border: 1px solid rgba(201,168,76,0.2);
      color: var(--muted); border-radius: 6px; padding: 5px 10px;
      font-size: 0.78rem; cursor: pointer; font-family: 'Jost', sans-serif;
      transition: all 0.2s;
    }
    .btn-logout:hover { border-color: var(--error); color: #e57373; }
  </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
  <div class="logo">🌸 Essence <em style="font-style:normal">&</em> Co.</div>
  <div class="nav-links">
    <div id="nav-guest" style="display:flex;gap:10px;align-items:center">
      <button class="btn-nav btn-ingresar" onclick="abrirModalLogin()">Iniciar sesión</button>
      <button class="btn-nav btn-staff" onclick="window.location.href='Login_staff.html'">🔒 Staff</button>
    </div>
    <div id="nav-user" style="display:none">
      <div class="user-info">
        <div class="user-avatar" id="user-avatar"></div>
        <span class="user-nombre" id="user-nombre"></span>
        <button class="btn-logout" onclick="cerrarSesion()">Salir</button>
      </div>
    </div>
    <button class="btn-nav btn-carrito" onclick="abrirCarrito()">
      🛒 Carrito <div class="carrito-count" id="carrito-count">0</div>
    </button>
  </div>
</nav>

<!-- HERO -->
<div class="hero">
  <div class="hero-content">
    <span class="hero-icon">🌸</span>
    <h1>Nuestra <em>Colección</em></h1>
    <p>Descubre fragancias únicas para cada momento especial</p>
    <div class="hero-search">
      <input type="text" id="buscador" placeholder="🔍 Buscar fragancia..." oninput="filtrar()"/>
      <select id="filtro-cat" onchange="filtrar()">
        <option value="">Todas las categorías</option>
      </select>
    </div>
  </div>
</div>

<!-- PRODUCTOS -->
<div class="container">
  <div class="section-label">Fragancias disponibles</div>
  <div class="grid" id="grid-productos">
    <div class="empty"><div class="icon">⏳</div><p>Cargando productos...</p></div>
  </div>
</div>

<!-- MODAL LOGIN CLIENTE -->
<div class="overlay" id="overlay-login" onclick="cerrarModalLogin(event)">
  <div class="modal-login" style="position:relative">
    <button class="btn-cerrar-modal" onclick="cerrarModalLogin()">✕</button>
    <h3>Inicia sesión</h3>
    <p>Para agregar productos al carrito necesitas una cuenta</p>
    <div class="modal-msg" id="modal-msg"></div>
    <div class="field">
      <label>Correo electrónico</label>
      <input type="email" id="modal-email" placeholder="tucorreo@ejemplo.com"/>
    </div>
    <div class="field">
      <label>Contraseña</label>
      <input type="password" id="modal-pass" placeholder="••••••••"/>
    </div>
    <button class="btn-modal-login" id="btn-modal-login" onclick="loginCliente()">Ingresar</button>
    <div class="modal-footer">
      ¿No tienes cuenta? <a onclick="window.location.href='Login_cliente.html'">Regístrate aquí</a>
      &nbsp;·&nbsp;
      <a onclick="window.location.href='Login_cliente.html#recuperar'">¿Olvidaste tu contraseña?</a>
    </div>
  </div>
</div>

<!-- CARRITO -->
<div class="carrito-panel" id="carrito-panel">
  <div class="carrito-header">
    <h3>Tu carrito</h3>
    <button class="btn-cerrar-carrito" onclick="cerrarCarrito()">✕</button>
  </div>
  <div id="carrito-contenido"></div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
  const API = "http://localhost:8000";
  let productos = [];
  let carrito = JSON.parse(localStorage.getItem("carrito_publico") || "[]");
  let usuario = JSON.parse(localStorage.getItem("usuario") || "null");
  let token = localStorage.getItem("token");

  // Verificar si hay sesión activa
  function actualizarNavbar() {
    if (usuario && token) {
      document.getElementById("nav-guest").style.display = "none";
      document.getElementById("nav-user").style.display = "flex";
      document.getElementById("user-nombre").textContent = usuario.nombre;
      document.getElementById("user-avatar").textContent = usuario.nombre.charAt(0).toUpperCase();
    } else {
      document.getElementById("nav-guest").style.display = "flex";
      document.getElementById("nav-user").style.display = "none";
    }
  }

  // Cargar productos (público, sin token)
  async function cargarProductos() {
    try {
      const res = await fetch(`${API}/api/productos/`);
      productos = await res.json();
      const cats = [...new Set(productos.map(p => p.categoria).filter(Boolean))];
      const sel = document.getElementById("filtro-cat");
      cats.forEach(c => {
        const opt = document.createElement("option");
        opt.value = c; opt.textContent = c; sel.appendChild(opt);
      });
      renderProductos(productos);
    } catch {
      document.getElementById("grid-productos").innerHTML =
        `<div class="empty"><div class="icon">⚠️</div><p>No se pudo conectar con el servidor.</p></div>`;
    }
  }

  function renderProductos(lista) {
    const grid = document.getElementById("grid-productos");
    if (!lista.length) {
      grid.innerHTML = `<div class="empty"><div class="icon">🔍</div><p>No se encontraron productos.</p></div>`;
      return;
    }
    grid.innerHTML = lista.map(p => `
      <div class="prod-card">
        <div class="prod-img">
          🌸
          ${p.stock === 0 ? `<div class="prod-badge-stock">Sin stock</div>` : ""}
          ${p.stock_bajo && p.stock > 0 ? `<div class="prod-badge-stock">Últimas unidades</div>` : ""}
        </div>
        <div class="prod-body">
          <div class="prod-cat">${p.categoria || "General"}</div>
          <div class="prod-nombre">${p.nombre}</div>
          <div class="prod-codigo">${p.codigo}</div>
          <div class="prod-desc">${p.descripcion || "Fragancia exclusiva de nuestra colección."}</div>
          <div class="prod-footer">
            <div>
              <div class="prod-precio">S/ ${parseFloat(p.precio).toFixed(2)}<small> soles</small></div>
            </div>
            <span class="prod-presentacion">${p.presentacion}</span>
          </div>
          ${p.stock === 0
            ? `<button class="btn-agregar" disabled>Sin stock</button>`
            : `<button class="btn-agregar" onclick="agregar(${p.id})">+ Agregar al carrito</button>`
          }
        </div>
      </div>
    `).join("");
  }

  function filtrar() {
    const texto = document.getElementById("buscador").value.toLowerCase();
    const cat   = document.getElementById("filtro-cat").value;
    renderProductos(productos.filter(p =>
      (p.nombre.toLowerCase().includes(texto) || p.codigo.toLowerCase().includes(texto)) &&
      (!cat || p.categoria === cat)
    ));
  }

  // Agregar al carrito — pide login si no hay sesión
  function agregar(id) {
    if (!token || !usuario) {
      abrirModalLogin();
      mostrarToast("Inicia sesión para agregar al carrito");
      return;
    }
    const p = productos.find(x => x.id === id);
    const en = carrito.find(x => x.producto_id === id);
    if (en) {
      if (en.cantidad >= p.stock) { mostrarToast(`Solo hay ${p.stock} unidades`); return; }
      en.cantidad++;
    } else {
      carrito.push({ producto_id: id, cantidad: 1, nombre: p.nombre,
                     precio: parseFloat(p.precio), presentacion: p.presentacion });
    }
    guardarCarrito();
    mostrarToast(`✓ ${p.nombre} agregado al carrito`);
  }

  function guardarCarrito() {
    localStorage.setItem("carrito_publico", JSON.stringify(carrito));
    document.getElementById("carrito-count").textContent = carrito.reduce((a,c) => a + c.cantidad, 0);
  }

  // MODAL LOGIN
  function abrirModalLogin() {
    document.getElementById("overlay-login").classList.add("show");
    setTimeout(() => document.getElementById("modal-email").focus(), 100);
  }

  function cerrarModalLogin(e) {
    if (!e || e.target === document.getElementById("overlay-login"))
      document.getElementById("overlay-login").classList.remove("show");
  }

  async function loginCliente() {
    const correo    = document.getElementById("modal-email").value.trim();
    const contrasena = document.getElementById("modal-pass").value;
    const msgEl     = document.getElementById("modal-msg");

    if (!correo || !contrasena) { msgEl.textContent = "Completa todos los campos."; return; }

    const btn = document.getElementById("btn-modal-login");
    btn.disabled = true; btn.textContent = "Ingresando...";

    try {
      const res  = await fetch(`${API}/api/auth/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ correo, contrasena, rol: "cliente" })
      });
      const data = await res.json();
      if (!res.ok) { msgEl.textContent = data.detail || "Credenciales incorrectas."; return; }

      token   = data.access_token;
      usuario = { id: data.id, nombre: data.nombre, rol: data.rol };
      localStorage.setItem("token", token);
      localStorage.setItem("usuario", JSON.stringify(usuario));

      cerrarModalLogin();
      actualizarNavbar();
      mostrarToast(`✓ Bienvenido, ${data.nombre}`);
      msgEl.textContent = "";
    } catch {
      msgEl.textContent = "No se pudo conectar con el servidor.";
    } finally {
      btn.disabled = false; btn.textContent = "Ingresar";
    }
  }

  // CARRITO PANEL
  function abrirCarrito() {
    renderCarrito();
    document.getElementById("carrito-panel").classList.add("open");
  }

  function cerrarCarrito() {
    document.getElementById("carrito-panel").classList.remove("open");
  }

  function renderCarrito() {
    const el = document.getElementById("carrito-contenido");
    if (!carrito.length) {
      el.innerHTML = `<div class="carrito-vacio"><div class="icon">🛒</div><p>Tu carrito está vacío</p></div>`;
      return;
    }
    const total = carrito.reduce((a,c) => a + c.precio * c.cantidad, 0);
    el.innerHTML = `
      ${carrito.map((c,i) => `
        <div class="carrito-item">
          <div class="carrito-item-info">
            <strong>${c.nombre}</strong>
            <small>${c.presentacion} · S/ ${c.precio.toFixed(2)} c/u</small>
          </div>
          <div class="qty-ctrl">
            <button class="btn-qty" onclick="cambiarQty(${i},-1)">−</button>
            <span class="qty-num">${c.cantidad}</span>
            <button class="btn-qty" onclick="cambiarQty(${i},1)">+</button>
          </div>
          <span class="item-precio">S/ ${(c.precio*c.cantidad).toFixed(2)}</span>
          <button class="btn-quitar" onclick="quitarItem(${i})">✕</button>
        </div>
      `).join("")}
      <div class="carrito-total">
        <span>Total a pagar</span>
        <strong>S/ ${total.toFixed(2)}</strong>
      </div>
      <button class="btn-confirmar" onclick="confirmarPedido()">Confirmar pedido</button>
    `;
  }

  function cambiarQty(i, delta) {
    carrito[i].cantidad += delta;
    if (carrito[i].cantidad <= 0) carrito.splice(i, 1);
    guardarCarrito(); renderCarrito();
  }

  function quitarItem(i) {
    carrito.splice(i, 1);
    guardarCarrito(); renderCarrito();
  }

  async function confirmarPedido() {
    if (!token || !usuario) { abrirModalLogin(); return; }
    if (!carrito.length) return;
    try {
      const res = await fetch(`${API}/api/pedidos/`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
        body: JSON.stringify({ items: carrito.map(c => ({ producto_id: c.producto_id, cantidad: c.cantidad })) })
      });
      const data = await res.json();
      if (!res.ok) { mostrarToast("Error: " + data.detail); return; }
      mostrarToast(`✓ Pedido #${data.pedido_id} confirmado · S/ ${data.total.toFixed(2)}`);
      carrito = []; guardarCarrito(); cerrarCarrito(); cargarProductos();
    } catch {
      mostrarToast("Error de conexión");
    }
  }

  function cerrarSesion() {
    localStorage.removeItem("token");
    localStorage.removeItem("usuario");
    token = null; usuario = null;
    actualizarNavbar();
    mostrarToast("Sesión cerrada");
  }

  function mostrarToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2800);
  }

  // Enter en modal login
  document.addEventListener("keydown", e => {
    if (e.key === "Enter" && document.getElementById("overlay-login").classList.contains("show"))
      loginCliente();
  });

  actualizarNavbar();
  guardarCarrito();
  cargarProductos();
</script>
</body>
</html>
